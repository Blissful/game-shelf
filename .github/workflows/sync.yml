name: Sync from BoardGameGeek and publish

on:
  schedule:
    - cron: "17 3 * * *"        # every night (UTC)
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: ["games.txt", "config.json", "extras.json", "site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shelf
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        if: env.BGG_TOKEN != ''
        run: npm install --no-audit --no-fund

      - name: Sync from BoardGameGeek
        if: env.BGG_TOKEN != ''
        run: node scripts/sync.mjs

      - name: No BGG token yet
        if: env.BGG_TOKEN == ''
        run: echo "::notice::BGG_TOKEN secret not set yet, so publishing the shelf without syncing (demo data until the first sync)."

      - name: Save updated data
        if: env.BGG_TOKEN != ''
        run: |
          git config user.name "shelf-bot"
          git config user.email "shelf-bot@users.noreply.github.com"
          git add site/data site/covers data
          if ! git diff --cached --quiet; then
            git commit -m "Sync from BoardGameGeek"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
